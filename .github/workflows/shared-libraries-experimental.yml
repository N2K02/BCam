name: BCam shared libraries experimental
on:
  push:
    branches: [experimental/shared-libraries]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build experimental APK
        env:
          N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
        run: |
          test -n "$N2K02_PACKAGES_TOKEN" || { echo "::error::Configure N2K02_PACKAGES_TOKEN Actions secret"; exit 1; }
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug -PuseN2K02Libraries=true
      - uses: actions/upload-artifact@v4
        with:
          name: BCam-shared-libraries-experimental
          path: app/build/outputs/apk/debug/*.apk
