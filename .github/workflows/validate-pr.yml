name: Validate Android pull request
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test without publishing
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
          else
            gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
          fi

  emulator:
    runs-on: ubuntu-latest
    env:
      N2K02_PACKAGES_TOKEN: {{ secrets.N2K02_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Exercise overlay preferences on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon connectedDebugAndroidTest
